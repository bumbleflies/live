<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  html { background: #1a1714; }
  .bg { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; background: #1a1714; }
  body { background: #1a1714; color: #f3f1ec; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; align-items: center; justify-content: center; }
  .frame { position: absolute; inset: 48px; border: 2px solid rgba(243,241,236,.2); pointer-events: none; }
  .card { position: relative; z-index: 1; text-align: center; }
  .kicker { display: inline-block; font-size: 32px; letter-spacing: .28em; text-transform: uppercase; color: #faf7f0; background: #4a3f8f; padding: 12px 28px 12px 34px; border-radius: 999px; margin-bottom: 36px; }
  h1 { font-family: "Instrument Serif", Georgia, serif; font-weight: 400; font-size: 170px; line-height: 1; }
  h1 em { font-style: italic; color: #a67c4d; }
  .sub { margin-top: 24px; font-size: 42px; color: rgba(243,241,236,.72); }
  .url { margin-top: 44px; font-size: 40px; letter-spacing: .06em; }
  .url b { background: #f5f1e8; color: #1a1714; padding: 10px 26px; border-radius: 999px; font-weight: 600; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="frame"></div>
  <div class="card">
    <div class="kicker">bumble:live</div>
    <h1>Danke fürs <em>Zuschauen</em></h1>
    <div class="sub">Nico, Sebi, Chris. Bis zur nächsten Session.</div>
    <div class="url"><b>bumbleflies.de</b></div>
  </div>
</body>
</html>
