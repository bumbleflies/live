name: ✨ Feature request
description: Propose a new capability or improvement for live
title: "[Area] Short description"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Feature requests that name the area and the concrete workflow they unblock get picked up
        faster than general ideas.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of live does this affect?
      options:
        - Room generation / links
        - OBS scene-collection download
        - Auth / login
        - UI (layout, dark mode, mobile)
        - infrastructure / deployment (Docker, CI, servyy-container)
        - other / not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What's the current pain point? Who runs into it, and how often?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead? Sketch the UI, API or workflow if you can.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why you didn't pick them.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
