name: Docker Push to Docker Hub (Reusable)

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKER_TOKEN:
        required: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: bumblecode/live

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image-live
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/live.tar
          docker image ls -a

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker image
        run: |
          docker push bumblecode/live:latest
          # Also push the sha-tagged image if it exists
          docker images bumblecode/live --format="{{.Repository}}:{{.Tag}}" | grep -v latest | while read tag; do
            docker push "$tag" || true
          done
