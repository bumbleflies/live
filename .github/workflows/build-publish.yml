name: Build, Test and Publish Docker (Reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. live-v1.2.3) to tag the image with. Leave empty to skip version tags."
        required: false
        type: string
        default: ""
      publish:
        description: "Push the image to the registry. Keep false for PRs and branch builds."
        required: false
        type: boolean
        default: false

env:
  REGISTRY: docker.io
  IMAGE_NAME: bumblecode/live

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute version number
        id: ver
        # metadata-action's semver tags cannot handle the live-v prefix
        run: echo "num=$(echo '${{ inputs.version }}' | sed -E 's/^live-v//')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.num }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.num }},enable=${{ inputs.version != '' }}
            type=sha,prefix=live-,enable=${{ github.event_name != 'pull_request' }}

      - name: Build Docker image to tar
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          outputs: type=docker,dest=/tmp/live.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-live
          path: /tmp/live.tar
          retention-days: 1

  healthcheck:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image-live
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/live.tar
          docker image ls -a

      - name: Test Docker image healthcheck
        run: |
          # JWT_SECRET is required at boot (fail-fast); the healthcheck only
          # needs the server to listen, so pass a throwaway value.
          docker run --rm --detach --name test_container \
            -e JWT_SECRET=ci-healthcheck-not-a-real-secret \
            bumblecode/live:latest
          for i in {1..10}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' test_container)
            health_details=$(docker inspect --format='{{json .State.Health}}' test_container)
            echo "Health status: $status"
            echo "Health details: $health_details"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 6
          done
          # Fail the step if not healthy after 10 retries
          if [ "$status" != "healthy" ]; then
            echo "Container did not become healthy after 10 attempts."
            docker logs test_container
            exit 1
          fi

      - name: Test authed room endpoint (exercises DATA_DIR write)
        run: |
          # The container above boots with JWT_SECRET=ci-healthcheck-not-a-real-secret;
          # sign a throwaway token with the same value (jsonwebtoken ships in the
          # app image) so POST /api/room can run inside the container. That endpoint
          # persists DATA_DIR — the exact write that failed as a silent EACCES 500
          # in production when /data was not writable by the container user.
          TOKEN=$(docker exec test_container node -e \
            "console.log(require('jsonwebtoken').sign({email:'ci@bumbleflies.de'},'ci-healthcheck-not-a-real-secret',{expiresIn:'1h'}))")
          status_code=$(docker exec test_container wget --header="Authorization: Bearer $TOKEN" \
            --server-response --post-data='' -q -O /dev/null http://localhost:3000/api/room 2>&1 \
            | grep -o "HTTP/1.[01] [0-9][0-9][0-9]" | awk '{print $2}' | tail -1)
          echo "POST /api/room -> $status_code"
          if [ "$status_code" != "200" ]; then
            echo "expected 200 — DATA_DIR is likely not writable by the container user"
            docker logs test_container || true
            exit 1
          fi
          docker stop test_container

  push:
    runs-on: ubuntu-latest
    needs: healthcheck
    if: inputs.publish
    permissions:
      contents: read

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image-live
          path: /tmp

      - name: Load Docker image
        run: |
          docker load --input /tmp/live.tar
          docker image ls -a

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker image
        run: |
          docker push bumblecode/live:latest
          # Also push the sha-tagged version if it exists
          docker images --no-trunc --quiet bumblecode/live | while read image_id; do
            docker images bumblecode/live --format="{{.Repository}}:{{.Tag}}" | grep -v latest | while read tag; do
              docker push "$tag" || true
            done
          done
